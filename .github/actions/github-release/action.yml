name: GitHub Release
description: Creates the GitHub Release for a tag, with notes drawn from the commits since the last one.
inputs:
  version:
    description: "The released version, without the tag prefix."
    required: true
  tag_prefix:
    description: "Prefix of the git tag."
    required: false
    default: "v"
runs:
  using: composite
  steps:
    - name: Create the release
      shell: bash
      run: ${{ github.action_path }}/release.sh ${{ inputs.version }} ${{ inputs.tag_prefix }}
